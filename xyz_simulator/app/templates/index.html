<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Gantry Robot · Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #ececec;
    --bg-deep: #dadcdf;
    --panel: #fafafa;
    --panel-2: #f3f3f1;
    --ink: #15171a;
    --ink-2: #3a3d42;
    --muted: #757a82;
    --line: #d8d9dc;
    --line-soft: #e6e7e9;
    --accent: oklch(0.62 0.18 245);
    --accent-soft: oklch(0.62 0.18 245 / 0.12);
    --accent-ink: oklch(0.42 0.18 245);
    --ok: oklch(0.62 0.14 150);
    --warn: oklch(0.72 0.14 70);
    --danger: oklch(0.58 0.20 25);
    --shadow: 0 1px 0 rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.04);
    --radius: 6px;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    --sans: 'IBM Plex Sans', system-ui, -apple-system, Segoe UI, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--bg);
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  input, select { font-family: inherit; }

  /* ===== App shell ===== */
  .app {
    display: grid;
    grid-template-rows: 52px 1fr 180px;
    height: 100vh;
    min-height: 720px;
  }
  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 0 18px;
    background: #1d2024;
    color: #e9eaec;
    border-bottom: 1px solid #0c0e10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  .brand .mark {
    width: 22px; height: 22px;
    background: var(--accent);
    border-radius: 4px;
    position: relative;
  }
  .brand .mark::before {
    content: ""; position: absolute; inset: 5px;
    border: 1.5px solid #fff; border-radius: 2px;
  }
  .brand .mark::after {
    content: ""; position: absolute;
    width: 5px; height: 5px; background: #fff;
    top: 8px; left: 8px; border-radius: 1px;
  }
  .brand small {
    color: #8d9299; font-weight: 400; margin-left: 6px;
    font-family: var(--mono); font-size: 11px;
  }
  .pills { display: flex; gap: 8px; margin-left: auto; align-items: center; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    background: #2a2e33;
    font-size: 11px;
    font-family: var(--mono);
    color: #cdd0d4;
    letter-spacing: 0.02em;
  }
  .pill .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.04);
  }
  .pill.ok .dot { background: var(--ok); box-shadow: 0 0 6px oklch(0.62 0.14 150 / 0.6); }
  .pill.warn .dot { background: var(--warn); }
  .pill.bad .dot { background: var(--danger); }
  .estop {
    margin-left: 10px;
    padding: 6px 14px 6px 28px;
    background: var(--danger);
    color: #fff;
    border: 1px solid oklch(0.45 0.20 25);
    border-radius: 4px;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
  }
  .estop::before {
    content: ""; position: absolute;
    left: 10px; top: 50%; transform: translateY(-50%);
    width: 10px; height: 10px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 2px var(--danger), 0 0 0 3px #fff;
  }

  /* Main grid */
  .main {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 1px;
    background: var(--line);
    overflow: hidden;
  }
  .pane {
    background: var(--panel);
    overflow: auto;
    display: flex;
    flex-direction: column;
  }
  .pane-head {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel-2);
    position: sticky; top: 0; z-index: 2;
  }
  .pane-head h2 {
    margin: 0;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-2);
    font-weight: 600;
  }
  .pane-head .tag {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  /* ===== Parameter panel ===== */
  .param-body { padding: 4px 0 24px; }
  .section {
    border-bottom: 1px solid var(--line-soft);
    padding: 12px 16px 16px;
  }
  .section > h3 {
    margin: 0 0 10px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .section > h3::before {
    content: "";
    width: 4px; height: 12px;
    background: var(--ink-2);
    border-radius: 1px;
  }
  .field {
    display: grid;
    grid-template-columns: 90px 1fr;
    align-items: center;
    gap: 8px;
    margin: 8px 0;
  }
  .field label {
    font-size: 11.5px;
    color: var(--ink-2);
    font-weight: 500;
  }
  .input, .select {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink);
    transition: border-color .12s, box-shadow .12s;
  }
  .input:focus, .select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .input.with-unit {
    padding-right: 40px;
  }
  .input-wrap { position: relative; }
  .input-wrap .unit {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font-family: var(--mono); font-size: 10.5px; color: var(--muted);
    pointer-events: none;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

  .conn-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    margin-top: 4px;
  }
  .btn {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background .1s, border-color .1s;
    letter-spacing: 0.02em;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: #f1f1f0; }
  .btn:active { background: #e8e8e6; }
  .btn.primary {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }
  .btn.primary:hover { background: #000; }
  .btn.accent {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn.accent:hover { background: oklch(0.55 0.18 245); }
  .btn.ghost { background: transparent; }
  .btn[disabled] { opacity: 0.4; cursor: not-allowed; }

  .switch {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    background: #fff;
  }
  .switch button {
    border: 0; background: transparent;
    padding: 6px 10px;
    font-size: 11.5px;
    color: var(--ink-2);
    cursor: pointer;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .switch button + button { border-left: 1px solid var(--line); }
  .switch button.on {
    background: var(--ink);
    color: #fff;
  }

  /* ===== Movement panel ===== */
  .move-tabs {
    display: flex;
    gap: 2px;
    background: var(--line);
    padding: 2px;
    border-radius: 5px;
  }
  .move-tabs button {
    border: 0; background: transparent;
    padding: 5px 12px;
    font-size: 11.5px;
    font-weight: 500;
    border-radius: 3px;
    cursor: pointer;
    color: var(--ink-2);
    letter-spacing: 0.02em;
  }
  .move-tabs button.on {
    background: #fff;
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }

  .move-body {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 1px;
    background: var(--line);
    min-height: 0;
  }
  .stage {
    background:
      radial-gradient(ellipse at 50% 35%, #fefefe 0%, #ececea 65%, #d6d6d3 100%);
    position: relative;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .stage-tools {
    position: absolute;
    top: 14px; left: 14px;
    right: 190px;                  /* leave room for axis-info panel */
    display: flex; gap: 6px;
    flex-wrap: wrap;
    z-index: 3;
  }
  .stage-tools .badge {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    padding: 5px 10px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-2);
    letter-spacing: 0.04em;
  }
  .stage-tools .badge b { color: var(--ink); font-weight: 600; }
  .stage-tools .badge .accent { color: var(--accent-ink); font-weight: 600; }

  /* View tools — orbit preset buttons */
  .view-tools {
    position: absolute;
    bottom: 38px;
    right: 14px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    z-index: 3;
  }
  .view-group {
    display: flex;
    background: rgba(255,255,255,0.92);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    backdrop-filter: blur(6px);
    box-shadow: var(--shadow);
  }
  .view-group button {
    border: 0;
    background: transparent;
    padding: 6px 10px;
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 600;
    color: var(--ink-2);
    cursor: pointer;
    letter-spacing: 0.04em;
  }
  .view-group button + button { border-left: 1px solid var(--line-soft); }
  .view-group button:hover { background: var(--panel-2); color: var(--accent-ink); }
  .view-readout {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    background: rgba(255,255,255,0.85);
    padding: 3px 8px;
    border-radius: 3px;
    border: 1px solid var(--line-soft);
    letter-spacing: 0.04em;
  }
  .stage-axisinfo {
    position: absolute;
    top: 14px; right: 14px;
    background: rgba(29,32,36,0.92);
    color: #f1f2f4;
    padding: 8px 12px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 11px;
    z-index: 3;
    min-width: 160px;
  }
  .stage-axisinfo .lbl {
    font-size: 9.5px; letter-spacing: 0.12em; color: #9aa0a6; text-transform: uppercase;
  }
  .stage-axisinfo .val { font-size: 18px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stage-axisinfo .u-suffix { font-size: 11px; color: #9aa0a6; margin-left: 4px; font-weight: 400; }
  .stage svg { flex: 1; width: 100%; display: block; min-height: 0; touch-action: none; user-select: none; cursor: grab; }
  .stage svg.dragging { cursor: grabbing; }

  .stage-hint {
    position: absolute;
    bottom: 12px; left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.85);
    border: 1px solid var(--line);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 11px;
    color: var(--muted);
    backdrop-filter: blur(6px);
    z-index: 3;
    white-space: nowrap;
  }
  .stage-hint kbd {
    font-family: var(--mono);
    background: #fff;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 3px;
    padding: 0 5px;
    margin: 0 2px;
    font-size: 10px;
    color: var(--ink);
  }

  /* Jog panel */
  .jog {
    background: var(--panel);
    padding: 16px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 14px;
  }
  .axis-card {
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 10px 12px;
    background: #fff;
    transition: border-color .12s, box-shadow .12s;
    cursor: pointer;
  }
  .axis-card.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .axis-card .row {
    display: flex; align-items: center; justify-content: space-between;
  }
  .axis-card .axis-name {
    display: flex; align-items: center; gap: 8px;
    font-weight: 600;
    font-size: 13px;
  }
  .axis-card .axis-tag {
    width: 18px; height: 18px;
    border-radius: 3px;
    background: var(--ink-2);
    color: #fff;
    display: inline-grid; place-items: center;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
  }
  .axis-card.active .axis-tag { background: var(--accent); }
  .axis-card .axis-pos {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .axis-card .axis-pos .u { color: var(--muted); font-size: 10.5px; margin-left: 2px; }
  /* Inline target editor inside each axis card */
  .axis-card .target-row {
    display: flex; align-items: center;
    margin-top: 8px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
    overflow: hidden;
    transition: border-color .12s;
  }
  .axis-card.active .target-row { border-color: var(--accent); }
  .axis-card .target-row button {
    border: 0; background: transparent;
    padding: 7px 11px;
    color: var(--ink-2);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1;
  }
  .axis-card .target-row button:hover { background: var(--panel-2); color: var(--accent-ink); }
  .axis-card .target-row input {
    flex: 1; min-width: 0;
    border: 0; background: transparent;
    text-align: right;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    padding: 7px 4px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .axis-card .target-row input:focus { outline: none; }
  .axis-card .target-row .u {
    padding: 0 9px 0 4px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10.5px;
    white-space: nowrap;
  }
  .axis-card .target-row.dirty { background: oklch(0.97 0.04 90 / 0.6); }
  .axis-card .axis-range {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    margin-top: 6px;
    display: flex; justify-content: space-between;
    font-variant-numeric: tabular-nums;
  }
  .axis-card .meter {
    margin-top: 8px;
    height: 4px;
    background: var(--line-soft);
    border-radius: 2px;
    position: relative;
    overflow: hidden;
  }
  .axis-card .meter .fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--ink-2);
    border-radius: 2px;
    transition: width .25s ease;
  }
  .axis-card.active .meter .fill { background: var(--accent); }

  .jog-topbar {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line-soft);
  }
  .jog-topbar .btn { flex: 1; }

  /* Numeric panel */
  .num-form {
    padding: 16px;
    overflow: auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    align-content: start;
  }
  .num-block {
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 12px;
    background: #fff;
  }
  .num-block .axis-head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
  }
  .num-block .axis-name { font-weight: 600; font-size: 14px; }
  .num-block .axis-name .sub { color: var(--muted); font-weight: 400; font-size: 11px; margin-left: 4px; font-family: var(--mono); }
  .num-block .current {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .num-block .current b { color: var(--ink); font-weight: 500; }
  .num-input {
    display: flex; align-items: center;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
    overflow: hidden;
  }
  .num-input button {
    border: 0; background: transparent;
    padding: 8px 10px;
    color: var(--ink-2);
    cursor: pointer;
    font-size: 14px;
    font-family: var(--mono);
  }
  .num-input button:hover { background: var(--panel-2); }
  .num-input input {
    flex: 1;
    border: 0;
    text-align: center;
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    padding: 8px 0;
    color: var(--ink);
    width: 100%;
    background: transparent;
    font-variant-numeric: tabular-nums;
  }
  .num-input input:focus { outline: none; }
  .num-input .u {
    padding-right: 10px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10.5px;
    white-space: nowrap;
  }
  .num-actions {
    grid-column: 1 / -1;
    display: flex; gap: 8px;
    border-top: 1px solid var(--line-soft);
    padding-top: 14px;
    margin-top: 4px;
  }
  .num-actions .grow { flex: 1; }

  /* Log */
  .log {
    background: #16181b;
    color: #cfd2d6;
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.55;
    border-top: 1px solid #0c0e10;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .log-head {
    padding: 8px 16px;
    display: flex; gap: 14px; align-items: center;
    color: #9aa0a6;
    border-bottom: 1px solid #24272c;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .log-head .chips { display: flex; gap: 6px; margin-left: auto; }
  .log-chip {
    padding: 2px 8px;
    border: 1px solid #2d3137;
    border-radius: 3px;
    cursor: pointer;
    color: #b1b6bb;
    font-size: 10px;
  }
  .log-chip.on { background: #2a2e33; color: #fff; border-color: #3a3e44; }
  .log-body {
    flex: 1;
    overflow: auto;
    padding: 6px 16px 10px;
  }
  .log-line { display: grid; grid-template-columns: 88px 50px 220px 1fr; gap: 12px; }
  .log-line .t { color: #6a6f76; }
  .log-line .tag-mqtt { color: oklch(0.78 0.12 200); }
  .log-line .tag-api { color: oklch(0.78 0.12 140); }
  .log-line .tag-evt { color: oklch(0.80 0.12 80); }
  .log-line .tag-err { color: oklch(0.75 0.18 25); }
  .log-line .target { color: #8a9098; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log-line .msg { color: #e3e5e8; }
  .log-line .msg .k { color: oklch(0.78 0.10 250); }
  .log-line .msg .n { color: oklch(0.82 0.10 80); }
  .log-line .msg .s { color: oklch(0.80 0.12 140); }

  /* --- robot svg styles --- */
  .robot-axis { transition: opacity .15s; }
  .robot-axis.dim { opacity: 0.6; }
  .robot-axis .ax-hit { cursor: grab; }
  .robot-axis.dragging .ax-hit { cursor: grabbing; }

  .axis-arrow { cursor: pointer; opacity: 0; transition: opacity .12s; }
  .robot-axis.active .axis-arrow { opacity: 1; }
  .axis-arrow circle { fill: #fff; stroke: var(--accent); stroke-width: 1.4; }
  .axis-arrow:hover circle { fill: var(--accent); }
  .axis-arrow path { stroke: var(--accent); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .axis-arrow:hover path { stroke: #fff; }

  .floor-tick { stroke: #b8b9bc; stroke-width: 0.6; }
  .home-marker { fill: oklch(0.62 0.14 150); }
  .home-text { font-family: var(--mono); font-size: 7px; fill: #4a4e54; letter-spacing: 0.05em; }

  /* ===== Gear button on axis card ===== */
  .axis-card .axis-gear {
    border: 1px solid var(--line);
    background: #fff;
    width: 24px; height: 24px;
    border-radius: 4px;
    cursor: pointer;
    color: var(--ink-2);
    font-size: 13px;
    line-height: 1;
    display: inline-grid; place-items: center;
    margin-left: 6px;
    transition: background .1s, color .1s, border-color .1s;
  }
